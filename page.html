<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Фото</title>
  <style>
    /* KaiOS / Gecko 48 friendly: no CSS grid, no flex, no vars */
    html, body { margin: 0; padding: 0; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 16px;
      line-height: 1.35;
      background: #0b0d12;
      color: #e7eaf2;
    }

    .wrap {
      max-width: 360px; /* удобно для кнопочных экранов */
      margin: 0 auto;
      padding: 10px;
    }

    .header {
      background: #121724;
      border: 1px solid #1f2840;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
    }
    .title {
      margin: 0;
      font-size: 18px;
      font-weight: bold;
    }
    .hint {
      margin: 6px 0 0 0;
      font-size: 13px;
      color: #b6bdd3;
    }

    .card {
      background: #0f1420;
      border: 1px solid #1f2840;
      border-radius: 8px;
      padding: 8px;
      margin: 0 0 10px 0;
    }

    .imgbox {
      background: #070910;
      border: 1px solid #1a2238;
      border-radius: 6px;
      padding: 6px;
      text-align: center;
    }

    img {
      display: block;
      margin: 0 auto;
      max-width: 100%;
      height: auto;
      border-radius: 4px;
    }

    .fname {
      margin: 8px 2px 0 2px;
      font-size: 13px;
      color: #c9d0e6;
      word-wrap: break-word;
    }

    .footer {
      margin-top: 10px;
      font-size: 12px;
      color: #9aa3bf;
      text-align: center;
      padding: 6px 0 12px 0;
    }

    /* very basic focus for keypad navigation */
    a, button, [tabindex] { outline: none; }
    a:focus, button:focus, .focus:focus {
      outline: 2px solid #5aa7ff;
      outline-offset: 2px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <h1 class="title">Фотографии</h1>
      <p class="hint">▲▼ листать. Открывайте картинки из этой же папки.</p>
    </div>

    <div class="card">
      <div class="imgbox">
        <img src="photo_2026-01-03_01-20-36.jpg" alt="photo_2026-01-03_01-20-36.jpg">
      </div>
      <div class="fname">photo_2026-01-03_01-20-36.jpg</div>
    </div>

    <div class="card">
      <div class="imgbox">
        <img src="photo_2026-01-03_01-44-41.jpg" alt="photo_2026-01-03_01-44-41.jpg">
      </div>
      <div class="fname">photo_2026-01-03_01-44-41.jpg</div>
    </div>

    <div class="footer">KaiOS / Gecko 48</div>
  </div>
</body>
</html>
